<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-to-SQL Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            transition: all 0.3s ease;
        }

        /* Arabic font support */
        body[dir="rtl"] {
            font-family: 'Segoe UI', 'Arabic UI Text', 'Geeza Pro', 'Dubai', sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        body[dir="rtl"] .language-selector {
            right: auto;
            left: 20px;
        }

        .language-btn {
            background: rgba(255,255,255,0.9);
            border: none;
            padding: 10px 15px;
            margin: 0 5px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .language-btn.active {
            background: #4CAF50;
            color: white;
        }

        .language-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .main-content {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .query-section {
            padding: 40px;
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .query-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.3s ease;
        }

        .query-input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results-section {
            padding: 40px;
            border-top: 1px solid #eee;
        }

        .result-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #4CAF50;
        }

        body[dir="rtl"] .result-card {
            border-left: none;
            border-right: 4px solid #4CAF50;
        }

        .result-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .sql-code {
            background: #2d3748;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .tables-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .table-tag {
            background: #e3f2fd;
            color: #1565c0;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .explanation-text {
            background: #fff3e0;
            border: 1px solid #ffb74d;
            border-radius: 8px;
            padding: 15px;
            color: #e65100;
            line-height: 1.6;
        }

        .history-section {
            max-height: 400px;
            overflow-y: auto;
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
        }

        .history-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 3px solid #2196F3;
        }

        body[dir="rtl"] .history-item {
            border-left: none;
            border-right: 3px solid #2196F3;
        }

        .history-query {
            font-weight: 500;
            color: #333;
            margin-bottom: 5px;
        }

        .history-time {
            font-size: 12px;
            color: #666;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ffebee;
            border: 1px solid #f44336;
            border-radius: 8px;
            padding: 15px;
            color: #d32f2f;
            margin-top: 10px;
        }

        .success-message {
            background: #e8f5e8;
            border: 1px solid #4CAF50;
            border-radius: 8px;
            padding: 15px;
            color: #2e7d32;
            margin-top: 10px;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .query-section, .results-section {
                padding: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .language-selector {
                position: relative;
                top: 0;
                right: 0;
                text-align: center;
                margin-bottom: 20px;
            }
        }

        /* RTL-specific styles */
        body[dir="rtl"] {
            text-align: right;
        }

        body[dir="rtl"] .button-group {
            direction: ltr;
            justify-content: center;
        }

        body[dir="rtl"] .tables-list {
            direction: ltr;
            justify-content: flex-end;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="language-selector">
        <button class="language-btn active" data-lang="en" id="btn-en">English</button>
        <button class="language-btn" data-lang="ar" id="btn-ar">العربية</button>
    </div>

    <div class="container">
        <div class="header">
            <h1 id="welcome-title">Welcome to Text-to-SQL Converter</h1>
        </div>

        <div class="main-content">
            <div class="query-section">
                <div class="input-group">
                    <textarea 
                        id="query-input" 
                        class="query-input" 
                        placeholder="Enter your database query in natural language..."
                        rows="4"
                    ></textarea>
                </div>

                <div class="button-group">
                    <button id="generate-btn" class="btn btn-primary">Generate SQL</button>
                    <button id="explain-btn" class="btn btn-secondary" disabled>Explain Query</button>
                    <button id="history-btn" class="btn btn-secondary">History</button>
                    <button id="clear-btn" class="btn btn-danger">Clear History</button>
                </div>

                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p id="loading-text">Processing...</p>
                </div>
            </div>

            <div id="results-section" class="results-section hidden">
                <div id="sql-result" class="result-card">
                    <h3 id="sql-title" class="result-title">Generated SQL Query</h3>
                    <div id="sql-code" class="sql-code"></div>
                    
                    <div style="margin-top: 15px;">
                        <h4 id="tables-title" class="result-title">Tables Used</h4>
                        <div id="tables-list" class="tables-list"></div>
                    </div>
                </div>

                <div id="explanation-result" class="result-card hidden">
                    <h3 id="explanation-title" class="result-title">Explanation</h3>
                    <div id="explanation-text" class="explanation-text"></div>
                </div>
            </div>

            <div id="history-section" class="results-section hidden">
                <h3 id="history-title" class="result-title">Conversation History</h3>
                <div id="history-list" class="history-section">
                    <p id="no-history">No conversation history available</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        class TextToSQLApp {
            constructor() {
                this.currentLanguage = 'en';
                this.conversationId = this.generateConversationId();
                this.lastSqlQuery = null;
                this.translations = {};
                
                this.initializeElements();
                this.bindEvents();
                this.loadTranslations();
            }

            generateConversationId() {
                return 'conv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            initializeElements() {
                // Input elements
                this.queryInput = document.getElementById('query-input');
                
                // Buttons
                this.generateBtn = document.getElementById('generate-btn');
                this.explainBtn = document.getElementById('explain-btn');
                this.historyBtn = document.getElementById('history-btn');
                this.clearBtn = document.getElementById('clear-btn');
                this.langBtnEn = document.getElementById('btn-en');
                this.langBtnAr = document.getElementById('btn-ar');
                
                // Results sections
                this.resultsSection = document.getElementById('results-section');
                this.historySection = document.getElementById('history-section');
                this.loadingDiv = document.getElementById('loading');
                
                // Result elements
                this.sqlCode = document.getElementById('sql-code');
                this.tablesList = document.getElementById('tables-list');
                this.explanationResult = document.getElementById('explanation-result');
                this.explanationText = document.getElementById('explanation-text');
                this.historyList = document.getElementById('history-list');
            }

            bindEvents() {
                this.generateBtn.addEventListener('click', () => this.generateSQL());
                this.explainBtn.addEventListener('click', () => this.explainQuery());
                this.historyBtn.addEventListener('click', () => this.showHistory());
                this.clearBtn.addEventListener('click', () => this.clearHistory());
                this.langBtnEn.addEventListener('click', () => this.switchLanguage('en'));
                this.langBtnAr.addEventListener('click', () => this.switchLanguage('ar'));
                
                // Enter key support
                this.queryInput.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'Enter') {
                        this.generateSQL();
                    }
                });
            }

            async loadTranslations() {
                try {
                    const response = await fetch(`/translations/${this.currentLanguage}`);
                    this.translations = await response.json();
                    this.updateUI();
                } catch (error) {
                    console.error('Failed to load translations:', error);
                }
            }

            switchLanguage(lang) {
                this.currentLanguage = lang;
                
                // Update language buttons
                document.querySelectorAll('.language-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.getElementById(`btn-${lang}`).classList.add('active');
                
                // Update HTML attributes
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
                
                this.loadTranslations();
            }

            updateUI() {
                const t = this.translations;
                
                // Update text content
                document.getElementById('welcome-title').textContent = t.welcome || 'Welcome to Text-to-SQL Converter';
                this.queryInput.placeholder = t.query_placeholder || 'Enter your database query in natural language...';
                this.generateBtn.textContent = t.generate || 'Generate SQL';
                this.explainBtn.textContent = t.explain || 'Explain Query';
                this.historyBtn.textContent = t.history || 'History';
                this.clearBtn.textContent = t.clear || 'Clear History';
                
                document.getElementById('sql-title').textContent = t.sql_result || 'Generated SQL Query';
                document.getElementById('tables-title').textContent = t.tables_used || 'Tables Used';
                document.getElementById('explanation-title').textContent = t.explanation || 'Explanation';
                document.getElementById('history-title').textContent = t.history || 'History';
                document.getElementById('no-history').textContent = t.no_history || 'No conversation history available';
                document.getElementById('loading-text').textContent = t.processing || 'Processing...';
            }

            showLoading(show) {
                this.loadingDiv.style.display = show ? 'block' : 'none';
                this.generateBtn.disabled = show;
            }

            showError(message) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = message;
                
                // Remove any existing error messages
                document.querySelectorAll('.error-message').forEach(el => el.remove());
                
                // Add error message
                this.queryInput.parentNode.appendChild(errorDiv);
                
                // Remove after 5 seconds
                setTimeout(() => {
                    errorDiv.remove();
                }, 5000);
            }

            showSuccess(message) {
                const successDiv = document.createElement('div');
                successDiv.className = 'success-message';
                successDiv.textContent = message;
                
                // Remove any existing success messages
                document.querySelectorAll('.success-message').forEach(el => el.remove());
                
                // Add success message
                this.queryInput.parentNode.appendChild(successDiv);
                
                // Remove after 3 seconds
                setTimeout(() => {
                    successDiv.remove();
                }, 3000);
            }

            async generateSQL() {
                const query = this.queryInput.value.trim();
                if (!query) {
                    this.showError(this.translations.error || 'Please enter a query');
                    return;
                }

                this.showLoading(true);
                this.hideAllSections();

                try {
                    const response = await fetch('/api/query', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            query: query,
                            language: this.currentLanguage,
                            conversation_id: this.conversationId
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    
                    // Store last SQL query
                    this.lastSqlQuery = result.sql_query;
                    
                    // Display results
                    this.displaySQLResult(result);
                    this.explainBtn.disabled = false;
                    
                } catch (error) {
                    console.error('Error generating SQL:', error);
                    this.showError(this.translations.error + ': ' + error.message);
                } finally {
                    this.showLoading(false);
                }
            }

            async explainQuery() {
                if (!this.lastSqlQuery) {
                    this.showError('No SQL query to explain');
                    return;
                }

                this.showLoading(true);

                try {
                    const response = await fetch('/api/explain', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            sql_query: this.lastSqlQuery,
                            language: this.currentLanguage,
                            conversation_id: this.conversationId
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    this.displayExplanation(result.explanation);
                    
                } catch (error) {
                    console.error('Error explaining query:', error);
                    this.showError(this.translations.error + ': ' + error.message);
                } finally {
                    this.showLoading(false);
                }
            }

            async showHistory() {
                this.showLoading(true);
                this.hideAllSections();

                try {
                    const response = await fetch(`/api/conversation/${this.conversationId}/history`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    this.displayHistory(result.messages);
                    
                } catch (error) {
                    console.error('Error loading history:', error);
                    this.showError(this.translations.error + ': ' + error.message);
                } finally {
                    this.showLoading(false);
                }
            }

            async clearHistory() {
                if (!confirm('Are you sure you want to clear the conversation history?')) {
                    return;
                }

                try {
                    const response = await fetch(`/api/conversation/${this.conversationId}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    this.showSuccess('Conversation history cleared');
                    this.hideAllSections();
                    this.lastSqlQuery = null;
                    this.explainBtn.disabled = true;
                    
                    // Generate new conversation ID
                    this.conversationId = this.generateConversationId();
                    
                } catch (error) {
                    console.error('Error clearing history:', error);
                    this.showError(this.translations.error + ': ' + error.message);
                }
            }

            displaySQLResult(result) {
                // Display SQL code
                this.sqlCode.textContent = result.sql_query;
                
                // Display tables used
                this.tablesList.innerHTML = '';
                result.tables_used.forEach(table => {
                    const tag = document.createElement('span');
                    tag.className = 'table-tag';
                    tag.textContent = table;
                    this.tablesList.appendChild(tag);
                });
                
                // Show results section
                this.resultsSection.classList.remove('hidden');
                this.historySection.classList.add('hidden');
            }

            displayExplanation(explanation) {
                this.explanationText.textContent = explanation;
                this.explanationResult.classList.remove('hidden');
            }

            displayHistory(messages) {
                this.historyList.innerHTML = '';
                
                if (messages.length === 0) {
                    const noHistory = document.createElement('p');
                    noHistory.id = 'no-history';
                    noHistory.textContent = this.translations.no_history || 'No conversation history available';
                    this.historyList.appendChild(noHistory);
                } else {
                    messages.slice().reverse().forEach(message => {
                        if (message.role === 'user') {
                            const item = document.createElement('div');
                            item.className = 'history-item';
                            
                            const query = document.createElement('div');
                            query.className = 'history-query';
                            query.textContent = message.content;
                            
                            const time = document.createElement('div');
                            time.className = 'history-time';
                            time.textContent = new Date(message.timestamp).toLocaleString();
                            
                            item.appendChild(query);
                            item.appendChild(time);
                            this.historyList.appendChild(item);
                        }
                    });
                }
                
                this.historySection.classList.remove('hidden');
                this.resultsSection.classList.add('hidden');
            }

            hideAllSections() {
                this.resultsSection.classList.add('hidden');
                this.historySection.classList.add('hidden');
                this.explanationResult.classList.add('hidden');
            }
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            new TextToSQLApp();
        });
    </script>
</body>
</html>
